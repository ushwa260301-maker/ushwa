name: Test species-catalog

# 배포(pages.yml)와 분리한다. pages.yml 이 main 전용인 것은 github-pages
# environment 의 보호 규칙 때문이며, 그 제약은 **배포 잡에만** 해당한다.
# 회귀 테스트는 반대로 feature branch 와 PR 에서 돌아야 의미가 있다 —
# main 에 도달한 뒤에 처음 실행되는 검증은 아무것도 막지 못한다.
# (AUDIT_PROTOCOL.md §6)
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 같은 ref 의 이전 실행을 취소한다. push 와 pull_request 가 동시에 걸리는
# 브랜치에서 중복 실행이 쌓이는 것을 막는다.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # 회귀 테스트 — exit code 기반 러너만 게이트로 쓴다.
  #
  # 제외한 것과 사유 (AUDIT_PROTOCOL.md §6):
  #   cloud-smoke      외부 Supabase 상태에 의존 → 별도 수동 검증
  #   import-fixture   process.argv 를 받는 CLI 도구, 테스트가 아님
  #   classify-failure exit code 없는 진단 도구 (ocr-accuracy 가 호출)
  # ------------------------------------------------------------------
  tests:
    name: Regression runners
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # species-catalog 는 빌드도 의존성도 없는 정적 사이트이며 러너는
      # Node 내장 모듈만 쓴다. 루트 package.json 의 workspaces 는
      # species-catalog 와 무관한 영역(backend/frontend/mobile/shared)을
      # 가리키므로 `npm ci` 를 돌리면 불필요한 설치를 시도한다.
      # → setup-node 만 하고 node 로 직접 실행한다. (AUDIT_PROTOCOL.md §6)
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: OCR accuracy (>= 95%)
        run: node species-catalog/tests/ocr-accuracy.mjs

      - name: Plant Guide validator
        run: node species-catalog/tests/guide-validate.mjs

      - name: Sync pending replay routing
        run: node species-catalog/tests/sync-pending.mjs

      - name: Supplier matcher
        run: node species-catalog/tests/supplier-matcher.mjs

      - name: Service items
        run: node species-catalog/tests/service-items.mjs

      # 저장 직전 개인정보 제거. 제거(계좌·전화·예금주)와 보존(금액·수량·
      # 날짜·사업자번호·거래처명) 양방향을 고정한다.
      - name: PII sanitizer
        run: node species-catalog/tests/sanitize.mjs

      # 저장소의 Supabase SQL 을 일회용 로컬 PostgreSQL 에 적용해 검증한다.
      # 운영 DB 에 접속하지 않는다. 러너에 PostgreSQL 이 없으면 SKIP(exit 0).
      - name: DB schema (local PostgreSQL)
        run: node species-catalog/tests/db-schema.mjs

  # ------------------------------------------------------------------
  # PII 가드 — 실제 휴대폰·계좌·예금주가 저장소에 들어오면 실패한다.
  #
  # 2026-09-28 실물 fixture 비식별화 완료로 **전수 차단**으로 승격했다.
  #   1) 전수 검사  in-scope 경로 전체 (감사 범위 = backend/frontend/
  #                 mobile/shared 제외). 기존 잔존분이 다시 생기면 잡는다.
  #   2) 변경분 검사 모든 경로의 변경 파일. 미감사 영역으로의 신규 유입도
  #                 막는다.
  # 휴대폰은 .github/pii-allowlist.json 의 값만 통과한다.
  # (긴급 조치 §8 · AUDIT_PROTOCOL.md §5)
  # ------------------------------------------------------------------
  pii-guard:
    name: PII guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # diff 계산에 이력이 필요하다

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve changed files
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ]; then
            # PR — base 와의 3-dot diff (merge base 기준)
            RANGE="${BASE_SHA}...${GITHUB_SHA}"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            RANGE="${BEFORE_SHA}..${GITHUB_SHA}"
          elif git rev-parse --verify -q origin/main >/dev/null; then
            # 새 브랜치 첫 push — main 과의 차이를 본다
            RANGE="origin/main...${GITHUB_SHA}"
          else
            RANGE=""
          fi

          if [ -n "${RANGE}" ]; then
            git diff --name-only --diff-filter=ACMR "${RANGE}" > changed.txt || : > changed.txt
          else
            git ls-files > changed.txt
          fi

          echo "range=${RANGE:-<all files>}" >> "$GITHUB_OUTPUT"
          echo "변경 파일 $(wc -l < changed.txt)건 (범위: ${RANGE:-전체})"

      - name: Guard changed files
        run: |
          set -euo pipefail
          if [ ! -s changed.txt ]; then
            echo "PII guard: 변경 파일 없음 — 통과."
            exit 0
          fi
          xargs -a changed.txt -r node .github/scripts/pii-guard.mjs

      # 전수 차단. P0 의 Verification("실제 PII 0건")이 이 스텝의 PASS 다.
      - name: Guard all in-scope files
        if: always()
        run: |
          set -euo pipefail
          git ls-files \
            | grep -vE '^(backend|frontend|mobile|shared)/|package-lock\.json$' \
            | xargs -r node .github/scripts/pii-guard.mjs
